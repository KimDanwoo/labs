name: FE Deep

# fe-deep이나 그것이 쓰는 공유 패키지가 바뀐 PR에서만 정적 빌드 검사와 데이터 오류·재시도 흐름 e2e를 돌린다.
# 빌드는 요청 때 서버에서 실행되는 기능(경로·proxy·Server Action)이 생기면 실패한다(scripts/check-static-build.mjs).
# e2e는 자체 dev 서버로 돈다.
on:
  pull_request:
    paths:
      - 'apps/fe-deep/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/fe-deep.yml'

permissions:
  contents: read

concurrency:
  group: fe-deep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm turbo run build --filter=fe-deep

      - name: Install browser
        run: pnpm --filter fe-deep exec playwright install --with-deps chromium

      - name: Verify data error and retry flows
        run: pnpm --filter fe-deep test:e2e
