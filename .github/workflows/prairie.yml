name: Prairie

# prairie(Unicorn Rush)나 그것이 쓰는 공유 패키지가 바뀐 PR에서만 배포 빌드를 확인한다.
# e2e는 GPU 없는 러너가 실제 WebGL 화면을 그리지 못해 돌리지 않는다.
on:
  pull_request:
    paths:
      - 'apps/prairie/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/prairie.yml'

permissions:
  contents: read

concurrency:
  group: prairie-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build --filter=prairie # 의존 패키지(토큰)까지 빌드한다
