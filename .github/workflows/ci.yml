name: CI

on:
  pull_request:
    # 봇 워크플로우가 PR 생성 직후 머지해 CI가 뜨기 전 PR이 닫힌다 → startup failure만 남는다.
    # 봇이 커밋하는 경로는 CI 대상에서 제외한다.
    paths-ignore:
      - 'apps/dansoon/contents/**'
      - 'apps/dansoon/data/**'
      - 'apps/soundlab/src/entities/track/model/constants/tracks.ts'
      - 'apps/soundlab/assets/og-title.ttf'
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build Unicorn Rush
        run: pnpm --filter prairie build

      # 전체 빌드는 하지 않는다. fe-deep 등은 빌드 시점에 DB 시크릿이 필요하다.
      # e2e는 push 전 로컬 훅(.githooks/pre-push)이 바뀐 앱만 돌린다. Unicorn Rush는 GPU 없는 러너에서 실제 화면을 검증하지 못한다.
