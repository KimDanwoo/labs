name: CI

on:
  pull_request:
    # 봇 워크플로우가 PR 생성 직후 머지해 CI가 뜨기 전 PR이 닫힌다 → startup failure만 남는다.
    # 봇이 커밋하는 경로는 CI 대상에서 제외한다.
    paths-ignore:
      - 'apps/dansoon/contents/**'
      - 'apps/dansoon/data/**'
      - 'apps/soundlab/src/entities/track/model/constants/tracks.ts'
      - 'apps/soundlab/assets/og-title.ttf'
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # e2e는 해당 앱이나 공유 설정이 바뀔 때만 돌린다. diff를 못 구하면(강제 푸시 등) 전부 돌린다.
      - name: Detect changed apps
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          shared='^(packages/|pnpm-lock\.yaml$|package\.json$|\.nvmrc$|\.github/workflows/ci\.yml$)'
          files=$(git diff --name-only "$BASE" HEAD) || files=$'apps/prairie/\napps/fe-deep/'
          grep -qE "^apps/prairie/|$shared" <<<"$files" && echo "prairie=true" >> "$GITHUB_OUTPUT"
          grep -qE "^apps/fe-deep/|$shared" <<<"$files" && echo "fedeep=true" >> "$GITHUB_OUTPUT"
          true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Install browser
        if: steps.changes.outputs.fedeep || steps.changes.outputs.prairie
        run: pnpm --filter fe-deep exec playwright install --with-deps chromium

      - name: Verify data error and retry flows
        if: steps.changes.outputs.fedeep
        run: pnpm --filter fe-deep test:e2e

      - name: Build Unicorn Rush
        if: steps.changes.outputs.prairie
        run: pnpm --filter prairie build

      - name: Verify Unicorn Rush rendering and controls
        if: steps.changes.outputs.prairie
        run: pnpm --filter prairie test:e2e

      # 전체 빌드는 하지 않는다. fe-deep 등은 빌드 시점에 DB 시크릿이 필요하다.
      # Unicorn Rush는 외부 API 없이 빌드해 실제 WebGL·키보드·터치 흐름을 검증한다.
