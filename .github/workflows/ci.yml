name: CI

on:
  pull_request:
    # 봇 워크플로우가 PR 생성 직후 머지해 CI가 뜨기 전 PR이 닫힌다 → startup failure만 남는다.
    # 봇이 커밋하는 경로는 CI 대상에서 제외한다.
    paths-ignore:
      - 'apps/soundlab/src/entities/track/model/constants/tracks.ts'
      - 'apps/soundlab/src/views/player/model/constants/highlights.ts'
      - 'apps/soundlab/assets/og-title.ttf'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # PR은 바뀐 패키지와 그 패키지를 쓰는 앱만, main push는 전체를 검증한다.
      # 구조 검사(check:architecture, scripts/__tests__/*.test.mjs)는 저장소 전체 규칙이라 항상 돈다.
      AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
      # Vercel 원격 캐시. 포크 PR·Dependabot에는 시크릿이 없어 캐시 없이 돈다.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # --affected가 PR base 커밋과 비교한다

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # pnpm run 뒤 인자는 스크립트 끝(turbo run)에 붙는다. pnpm test는 내장 명령이라 인자를 넘기지 않는다.
      - name: Lint
        run: pnpm run lint $AFFECTED

      - name: Typecheck
        run: pnpm run typecheck $AFFECTED

      - name: Test
        run: pnpm run test $AFFECTED

      # 배포와 같은 next build를 머지 전에 돌려, 빌드에서만 나는 오류를 PR에서 잡는다.
      # soundlab은 prebuild가 SoundCloud에서 곡 목록을 받아 파일을 다시 쓰므로 뺀다(주간 동기화 워크플로가 맡는다).
      - name: Build
        run: pnpm run build $AFFECTED --filter=!soundlab
