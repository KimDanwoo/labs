name: CI

on:
  pull_request:
    # 봇 워크플로우가 PR 생성 직후 머지해 CI가 뜨기 전 PR이 닫힌다 → startup failure만 남는다.
    # 봇이 커밋하는 경로는 CI 대상에서 제외한다.
    paths-ignore:
      - 'apps/dansoon/contents/**'
      - 'apps/dansoon/data/**'
      - 'apps/soundlab/src/entities/track/model/constants/tracks.ts'
      - 'apps/soundlab/src/entities/track/model/constants/highlights.ts'
      - 'apps/soundlab/assets/og-title.ttf'
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # PR은 바뀐 패키지와 그 패키지를 쓰는 앱만, main push는 전체를 검증한다.
      # 구조 검사(check:architecture, scripts/__tests__/*.test.mjs)는 저장소 전체 규칙이라 항상 돈다.
      AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # --affected가 PR base 커밋과 비교한다

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # pnpm run 뒤 인자는 스크립트 끝(turbo run)에 붙는다. pnpm test는 내장 명령이라 인자를 넘기지 않는다.
      - name: Lint
        run: pnpm run lint $AFFECTED

      - name: Typecheck
        run: pnpm run typecheck $AFFECTED

      - name: Test
        run: pnpm run test $AFFECTED

      # 빌드는 하지 않는다. fe-deep 등은 빌드 시점에 DB 시크릿이 필요하고, 배포 빌드는 Vercel이 맡는다.
      # 앱 전용 검증(prairie 빌드, fe-deep e2e)은 앱별 워크플로가 그 앱이 바뀐 PR에서만 돌린다.
