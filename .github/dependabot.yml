# 액션은 커밋 SHA로 고정한다 — 새 버전이 나오면 Dependabot이 SHA와 버전 주석을 함께 올리는 PR을 연다
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
  # npm 의존성은 pnpm catalog(pnpm-workspace.yaml)째 올린다 — 부·패치는 한 PR, 주 버전은 따로
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # TypeScript 7(네이티브 컴파일러)에는 typescript-eslint·구조 검사가 쓰는 JS API(ts.sys)가 없다
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # rapier 0.21은 순간이동 직후 첫 가속이 멈칫한다(0.19.3 대비 실측) — 원인을 확인할 때까지 0.19에 둔다
      - dependency-name: '@dimforge/rapier3d-compat'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      # @types/node 주 버전은 실행 Node(.nvmrc)와 맞춘다 — Node를 올릴 때 함께 올린다
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-patch:
        update-types: ['minor', 'patch']
        # Prettier는 올리면 저장소 전체 포맷이 바뀌어 따로 받는다
        exclude-patterns: ['prettier']
