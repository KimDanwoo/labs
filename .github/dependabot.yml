# 액션은 커밋 SHA로 고정한다 — 새 버전이 나오면 Dependabot이 SHA와 버전 주석을 함께 올리는 PR을 연다
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
  # npm 의존성은 pnpm catalog(pnpm-workspace.yaml)째 올린다 — 부·패치는 한 PR, 주 버전은 따로
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: ['minor', 'patch']
