<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../packages/fonts/fonts/maruburi.css" />
    <style>
      body {
        margin: 0; width: 1200px; height: 630px; overflow: hidden; font-family: var(--font-maruburi);
        display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
        background:
          radial-gradient(ellipse 60% 50% at 20% 40%, oklch(0.3 0.12 264 / 25%) 0%, transparent 70%),
          radial-gradient(ellipse 50% 60% at 80% 30%, oklch(0.28 0.1 290 / 18%) 0%, transparent 70%),
          #070a12;
      }
      .badge {
        display: inline-flex; align-items: center; gap: 12px; padding: 10px 24px; border-radius: 999px; font-size: 24px;
        color: #379bd8; border: 1.5px solid rgb(55 155 216 / 25%); background: rgb(55 155 216 / 6%);
      }
      .badge::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: #379bd8; }
      h1 { margin: 28px 0 0; font-size: 180px; font-weight: 700; letter-spacing: -0.05em; line-height: 1; color: #f0f2f4; }
      h1 span { background: linear-gradient(to right, #379bd8, rgb(55 155 216 / 60%)); -webkit-background-clip: text; color: transparent; }
      p { margin: 30px 0 0; font-size: 36px; color: #9b9ea5; }
      p b { color: #f0f2f4; font-weight: 400; }
    </style>
  </head>
  <body>
    <div class="badge">프론트엔드 학습 플랫폼</div>
    <h1>프<span>딥</span></h1>
    <p>프론트엔드를 <b>딥하게</b> 알자</p>
  </body>
</html>
