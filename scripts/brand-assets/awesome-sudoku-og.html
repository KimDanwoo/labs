<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../packages/fonts/fonts/maruburi.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        padding: 56px 76px;
        background: #f8f5ed;
        color: #282336;
        font-family: var(--font-maruburi), serif;
      }
      main {
        display: grid;
        grid-template-columns: 1fr;
        height: 100%;
        align-items: center;
      }
      main:has(img:not([hidden])) {
        grid-template-columns: minmax(0, 1fr) 460px;
        gap: 42px;
      }
      .brand {
        display: block;
        padding-bottom: 18px;
        border-bottom: 1px solid #827405;
        font-size: 28px;
        font-weight: 700;
      }
      h1 {
        margin: 46px 0 22px;
        font-size: 98px;
        font-weight: 700;
        letter-spacing: -0.07em;
        line-height: 1.16;
        white-space: pre-line;
        word-break: keep-all;
      }
      main:has(img:not([hidden])) h1 {
        font-size: 73px;
      }
      .subtitle {
        margin: 0;
        color: #5e526a;
        font-size: 30px;
        word-break: keep-all;
      }
      img {
        display: block;
        width: 100%;
        max-height: 485px;
        object-fit: contain;
        border-radius: 18px;
      }
      img[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <span class="brand" data-brand></span>
        <h1 data-title></h1>
        <p class="subtitle" data-subtitle></p>
      </div>
      <img data-artwork alt="" hidden />
    </main>
  </body>
</html>
