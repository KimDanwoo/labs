<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../packages/fonts/fonts/maruburi.css" />
    <style>
      body { margin: 0; width: 1200px; height: 630px; overflow: hidden; font-family: var(--font-maruburi); }
      .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 42%; }
      .shade { position: absolute; inset: 0; background: linear-gradient(to top, rgb(18 30 12 / 78%), rgb(18 30 12 / 34%) 38%, transparent 62%); }
      .title { position: absolute; left: 64px; bottom: 56px; color: #fffbea; text-shadow: 0 2px 18px rgb(0 0 0 / 35%); }
      h1 { margin: 0; font-size: 92px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
      p { margin: 18px 0 0; font-size: 32px; font-weight: 600; opacity: 0.92; }
    </style>
  </head>
  <body>
    <img class="art" src="../../apps/komorebi/public/art/village-game.webp" alt="" />
    <div class="shade"></div>
    <div class="title">
      <h1>코모레비</h1>
      <p>여름빛 산책</p>
    </div>
  </body>
</html>
