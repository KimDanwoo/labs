packages:
  - 'apps/*'
  - 'packages/*'

# 의존성 버전 단일 관리(catalog). 각 package.json은 "catalog:"로 참조한다.
# 버전 변경은 여기 한 곳만 수정 후 `pnpm install`.
catalog:
  # framework / runtime
  next: 16.3.8
  react: 19.2.8
  react-dom: 19.2.8

  # styling
  tailwindcss: ^4
  '@tailwindcss/postcss': ^4

  # state
  jotai: ^2.20.0

  # backend (awesome-sudoku) — firebase
  firebase: ^12.15.0

  # 3d (life-simulation 앱)
  three: 0.187.0
  '@react-three/fiber': 9.7.0
  '@react-three/drei': 10.7.8
  '@types/three': 0.187.0

  # danwoo-island 월드 엔진 — folio-2025 lockfile과 같은 버전으로 고정
  '@dimforge/rapier3d-compat': 0.19.3
  gsap: 3.15.1
  howler: 2.2.4
  seedrandom: 3.0.5
  camera-controls: 3.1.2
  normalize-wheel: 1.0.1
  '@types/howler': 2.2.13
  '@types/seedrandom': 3.0.8
  '@types/normalize-wheel': 1.0.4

  # tooling
  # TS 7은 코드상 통과하지만 typescript-eslint가 아직 미지원이라 보류(2026-08-30 확인).
  typescript: ^5
  tsx: ^4.19.2
  turbo: ^2.10.12
  '@playwright/test': 1.64.0
  prettier: ^3.4.2
  # ESLint 10은 eslint-config-next가 번들하는 eslint-plugin-react가 미지원(2026-08-30 확인).
  eslint: ^9
  eslint-config-next: 16.3.8

  # lint / format 공유 설정(@repo/eslint-config, @repo/prettier-config)에서 사용
  '@typescript-eslint/parser': ^8.68.0
  eslint-config-prettier: ^10.1.8
  eslint-import-resolver-typescript: ^4.4.5
  eslint-plugin-boundaries: ^7.2.0
  eslint-plugin-import-x: ^4.16.2
  eslint-plugin-prettier: ^5.5.6
  prettier-plugin-organize-imports: ^4.3.0

  # build 분석 (awesome-sudoku)
  '@next/bundle-analyzer': ^16.1.6

  # test (vitest)
  vitest: ^4.1.6
  '@vitejs/plugin-react': ^6.1.1
  jsdom: ^30.0.1
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.3

  # types (Node 24 고정 — .nvmrc)
  '@types/node': ^26.0.0
  '@types/react': ^19
  '@types/react-dom': ^19

  # ui utilities (shared across apps)
  clsx: ^2.1.1
  class-variance-authority: ^0.7.1
  radix-ui: ^1.4.3
  '@radix-ui/react-checkbox': ^1.3.3
  tailwind-merge: ^3.6.0
  lucide-react: ^1.37.0
  framer-motion: ^13.1.1
  next-themes: ^0.4.6

  # content / markdown
  react-markdown: ^10.1.0
  rehype-highlight: ^7.0.2
  remark-gfm: ^4.0.1

  # icons
  react-icons: ^5.5.0

  # backend / data
  '@supabase/ssr': ^0.8.0
  '@supabase/supabase-js': ^2.106.1
  '@tanstack/react-query': ^5.100.14
  # Komorebi 초대 멀티 서버 (Cloudflare 공식 런타임)
  wrangler: 4.160.1
  '@cloudflare/workers-types': 5.20261112.1

  # analytics
  '@vercel/analytics': ^2.0.1

  # i18n / locale
  korean-lunar-calendar: ^0.3.6

  # image processing
  sharp: ^0.35.5
  devalue: ^5.9.3

  # astro (dansoon)
  astro: ^7.2.9
  '@astrojs/check': ^0.9.10
  '@astrojs/react': ^6.0.4
  '@astrojs/rss': ^4.0.10
  '@astrojs/sitemap': ^3.2.1
  '@astrojs/markdown-satteri': 0.3.8
  overlayscrollbars: 2.17.0
  '@tailwindcss/typography': ^0.5.15
  '@tailwindcss/vite': ^4.1.0
  prettier-plugin-astro: ^0.14.1
  # 코드 블록(복사·파일명·줄 강조). Astro 7 지원(peer ^7.0.0) 확인.
  astro-expressive-code: 0.44.3
  # 티스토리 글 이전 스크립트. 7.2.5는 배포 직후라 검증된 7.2.4로 고정한다.
  turndown: 7.2.4
  # 빌드 때 OG 이미지(글·책 리포트 카드)를 그린다. Vercel 유지 관리.
  satori: 0.63.2

  # ui (fe-deep)
  shadcn: ^4.19.0
  tw-animate-css: ^1.4.0

catalogs:
  fb11:
    firebase: ^11.9.1
