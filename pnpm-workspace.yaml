packages:
  - 'apps/*'
  - 'packages/*'

# 의존성 버전 단일 관리(catalog). 각 package.json은 "catalog:"로 참조한다.
# 버전 변경은 여기 한 곳만 수정 후 `pnpm install`.
catalog:
  # framework / runtime
  next: 16.4.6
  react: 19.3.1
  react-dom: 19.3.1

  # styling
  tailwindcss: ^4
  '@tailwindcss/postcss': ^4

  # state
  jotai: ^3.0.2

  # 3d (life-simulation 앱)
  three: 0.187.0
  '@react-three/fiber': 9.8.2
  '@react-three/drei': 10.7.9
  '@types/three': 0.187.0

  # danwoo-island 월드 엔진 — folio-2025 lockfile과 같은 버전으로 고정
  '@dimforge/rapier3d-compat': 0.19.3
  gsap: 3.15.1
  howler: 2.2.4
  seedrandom: 3.0.5
  normalize-wheel: 1.0.1
  '@types/howler': 2.2.13
  '@types/seedrandom': 3.0.8
  '@types/normalize-wheel': 1.0.4
  draco3d: 1.5.9

  # tooling
  # TS 7은 코드상 통과하지만 typescript-eslint가 아직 미지원이라 보류(2026-08-30 확인).
  typescript: ^5
  tsx: ^4.23.15
  turbo: ^2.11.11
  '@playwright/test': 1.65.1
  prettier: ~3.8.3
  # ESLint 10은 eslint-config-next가 번들하는 eslint-plugin-react가 미지원(2026-08-30 확인).
  eslint: ^10
  eslint-config-next: 16.4.6

  # lint / format 공유 설정(@repo/eslint-config, @repo/prettier-config)에서 사용
  '@typescript-eslint/parser': ^8.72.2
  eslint-config-prettier: ^10.1.8
  eslint-import-resolver-typescript: ^4.4.5
  eslint-plugin-boundaries: ^7.4.4
  eslint-plugin-import-x: ^4.18.1
  eslint-plugin-prettier: ^5.5.7
  prettier-plugin-organize-imports: ^4.3.0

  # build 분석 (awesome-sudoku)
  '@next/bundle-analyzer': ^16.4.6

  # test (vitest)
  vitest: ^5.1.0
  '@vitejs/plugin-react': ^6.3.0
  jsdom: ^31.0.1
  '@testing-library/jest-dom': ^8.0.0
  '@testing-library/react': ^16.3.3

  # types (Node 24 고정 — .nvmrc)
  '@types/node': ^24.19.2
  '@types/react': ^19
  '@types/react-dom': ^19

  # ui utilities (shared across apps)
  clsx: ^2.1.1
  class-variance-authority: ^0.7.1
  radix-ui: ^1.8.1
  tailwind-merge: ^3.7.0
  lucide-react: ^1.73.0
  framer-motion: ^14.14.0
  next-themes: ^0.4.6

  # content / markdown
  react-markdown: ^10.1.0
  rehype-highlight: ^7.0.2
  remark-gfm: ^4.0.1
  yaml: ^2.9.1

  # icons
  react-icons: ^5.5.0

  # backend / data
  '@tanstack/react-query': ^5.107.1

  # analytics

  # image processing
  sharp: ^0.35.5

  # ui (fe-deep)
  tw-animate-css: ^1.4.0
